name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: api
        run: pip install -r requirements.txt pytest pytest-asyncio aiosqlite
      - name: Test
        working-directory: api
        run: python -m pytest tests/ -q

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install deps
        working-directory: portal
        run: npm ci
      - name: Build
        working-directory: portal
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://mailprotocol.cbncloud.net/api
