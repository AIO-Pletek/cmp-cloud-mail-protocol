# CMP OpenDKIM Configuration
# /etc/opendkim/opendkim.conf
# Note: Rspamd handles DKIM signing directly, but OpenDKIM can be
# used as a fallback or for additional key management

# Pid file
PidFile /run/opendkim/opendkim.pid

# User and group
UserID opendkim:opendkim

# Socket for Postfix
Socket inet:8891@127.0.0.1

# Syslog
Syslog yes
SyslogSuccess yes
LogWhy yes

# Signing
Mode sv
SubDomains no

# Key table and signing table
KeyTable refile:/etc/opendkim/KeyTable
SigningTable refile:/etc/opendkim/SigningTable
ExternalIgnoreList refile:/etc/opendkim/TrustedHosts
InternalHosts refile:/etc/opendkim/TrustedHosts

# Key directory
KeyFile /etc/opendkim/keys

# Canonicalization
Canonicalization relaxed/simple

# Signature algorithm
SignatureAlgorithm rsa-sha256

# Oversign headers to prevent replay attacks
OversignHeaders From

# Minimum key size
MinimumKeyBits 1024

# Report sender
SendReports yes
ReportAddress "CMP Mail System <postmaster@cmp.local>"

# Statistics
Statistics /var/log/opendkim/stats

# Temporary directory
TemporaryDirectory /tmp

# Background
Background yes

# Umask
Umask 0002

# Trust anchor file
# AutoRestart yes
# AutoRestartCount 10
# AutoRestartRate 5/1h

# Maximum number of signers
MaximumSignaturesToVerify 3

# Header list to sign
# On-Default headers:
# From, Sender, Reply-To, Subject, Date, Message-ID, To, Cc,
# MIME-Version, Content-Type, Content-Transfer-Encoding,
# Content-ID, Content-Description, Resent-Date, Resent-From,
# Resent-Sender, Resent-To, Resent-Cc, Resent-Message-ID,
# In-Reply-To, References, List-Id, List-Help, List-Unsubscribe,
# List-Subscribe, List-Post, List-Owner, List-Archive

# Domain list (auto-discovered from KeyTable/SigningTable)
# Domain cmp.local

# Auto restart on failure
AutoRestart yes
AutoRestartCount 10
AutoRestartRate 5/1h
