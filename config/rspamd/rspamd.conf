# CMP Rspamd Main Configuration
# /etc/rspamd/rspamd.conf
# This is the master config that includes all local.d overrides

# Module search path
modules = "${PLUGINSDIR}";

# Include configuration overrides from local.d
.include(priority=1) try=true; glob="${CONFDIR}/local.d/*.conf"

# Include overrides from override.d (higher priority)
.include(priority=2) try=true; glob="${CONFDIR}/override.d/*.conf"

# Default configuration (lowest priority)
.include(priority=0) try=true; glob="${CONFDIR}/default.conf"
