# Rspamd Greylisting Configuration
# local.d/greylist.conf

# Enable greylisting
enabled = true;

# Whititelist these IPs (no greylisting)
whitelisted_ip = [
    "127.0.0.0/8",
    "::1"
];

# Whitelist these sender domains
whitelisted_domains = [
    "google.com",
    "microsoft.com",
    "amazon.com"
];

# Greylist expiry
expire = 30d;

# Key derivation
key_prefix = "gl";

# Count of successful deliveries before whitelisting
count = 3;

# Greylist symbol
symbol = "GREYLIST";

# Message for 4xx replies
message = "Greylisted, please try again later";

# Enable IPv6 greylisting
ipv6 = true;

# IPv6 mask for greylisting
ipv6_mask = 48;

# Allow authenticated users to skip greylisting
allow_auth_skip = true;
