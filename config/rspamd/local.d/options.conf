# Rspamd Options Configuration
# local.d/options.conf

# DNS
dns {
    nameserver = ["127.0.0.1:53:1", "8.8.8.8:53:1"];
    timeout = 5s;
    sockets = 16;
    retransmits = 3;
}

# DNSSEC
dnssec {
    enable = true;
}

# Temp directory
tempdir = "/tmp";

# PID file
pidfile = "/run/rspamd/rspamd.pid";

# Compile spamassassin rules
enable_experimental = false;

# Max workers (0 = auto)
max_workers = 0;

# CORS for WebUI
# enable_password = true;

# Fuzzy storage
fuzzy_storage = "127.0.0.1:11335";

# History backend
history_backend = "redis";

# Map file watch interval
map_watch_interval = 1min;

# URL reputation
url_tld {
    default = true;
    set1 = "https://rspamd.com/rspamd_tld.dat";
}

# SPF settings
spf_cache_size = 2048;
spf_cache_expire = 30min;

# DMARC
dmarc {
    enabled = true;
}

# Messages check
messages_check_enable = true;
