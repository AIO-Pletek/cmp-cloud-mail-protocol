# Rspamd Phishing Configuration
# local.d/phishing.conf

# Enable phishing module
enabled = true;

# OpenPhish feed
openphish {
    enabled = true;
    # Auto-updated feed
    url = "https://openphish.com/feed.txt";
    cache_expire = 1h;
}

# Phishtank
phishtank {
    enabled = true;
    url = "http://data.phishtank.com/data/online-valid.json";
    cache_expire = 1h;
}

# Domain reputation check
domain_reputation {
    enabled = true;
    servers {
        "multi.uribl.com" {
            checks = ["phishing", "malware"];
        }
    }
}

# Redirector tracking
redirector_hosts = [
    "t.co",
    "bit.ly",
    "goo.gl",
    "tinyurl.com",
    "ow.ly",
    "is.gd"
];

# Symbol for phishing detection
symbol = "PHISHING";

# Deceptive domains list
# Update from Rspamd feeds
