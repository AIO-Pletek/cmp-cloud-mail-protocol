# Rspamd DKIM Signing Configuration
# local.d/dkim_signing.conf

# Enable DKIM signing
enabled = true;

# Sign for these domains (keys stored in /var/lib/rspamd/dkim/)
path = "/var/lib/rspamd/dkim/$domain.$selector.key";

# Default selector
selector = "cmp";

# Domain configuration (can be per-domain)
domain {
    cmp.local {
        selector = "cmp";
        path = "/var/lib/rspamd/dkim/cmp.local.cmp.key";
    }
}

# Sign authenticated users
sign_authenticated = true;

# Sign local networks
sign_local = true;

# Sign outbound only (skip inbound)
sign_inbound = false;

# Skip signing for these domains
skip_multi = false;

# Use ARC signing for forwarded messages
arc {
    enabled = true;
    selector = "cmp";
    path = "/var/lib/rspamd/dkim/$domain.$selector.key";
    sign_authenticated = true;
}

# Hash algorithm
algorithm = "rsa-sha256";

# Header canonicalization
header_canon = "relaxed";

# Body canonicalization
body_canon = "relaxed";

# Allow username mismatch
allow_username_mismatch = false;

# Try to verify before signing
verify = true;

# Symbol to add on signing
symbol = "DKIM_SIGNED";

# Header blacklist (don't sign these headers)
headers_blacklist = ["DKIM-Signature"];
