# Rspamd Bayes Classifier Configuration
# local.d/classifier-bayes.conf

backend = "redis";

# Token expiration
token = 5184000;

# Minimum tokens required for classification
min_tokens = 11;

# Minimum learn count
min_learns = 200;

# Autolearning threshold
autolearn {
    spam_threshold = 6.0;
    ham_threshold = -0.5;
    check_balance = true;
}

# Bayes per-user stats
per_user = false;

# Language detection
languages_detection = true;

# Cache
cache {
    path = "/var/lib/rspamd/bayes_cache.db";
    size = 100M;
    max_elt = 16384;
}

# Statfile settings
statfile {
    symbol = "BAYES_HAM";
    spam = false;
    size = 200M;
}

statfile {
    symbol = "BAYES_SPAM";
    spam = true;
    size = 200M;
}

# Fuzzy learn
fuzzy_learn = false;

# Users settings
users_enabled = false;

# Schema version (migration)
schema_version = 2;
