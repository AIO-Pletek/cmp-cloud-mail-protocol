# Rspamd Redis Configuration
# local.d/redis.conf

# Redis connection
server = "127.0.0.1:6379";
# password = "redis_password_here";
db = "1";

# Timeouts
timeout = 10s;
expand_keys = true;

# Read timeout
read_timeout = 5s;

# Write timeout
write_timeout = 5s;

# Retries
retransmits = 3;

# Expiration for keys
expire = 7200;

# Greylist keys expire
greylist_expire = 600;

# Bayes tokens expiration
tokens_expire = 172800;
