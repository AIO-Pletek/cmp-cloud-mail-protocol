# Rspamd Metrics Configuration
# local.d/metrics.conf

# Main metric (default)
name = "default";

# Actions thresholds
actions {
    reject = 15;
    add_header = 6;
    greylist = 4;
    "rewrite subject" = 8;
}

# Symbol weights
symbol "SPF_FAIL" {
    weight = 1.0;
    description = "SPF validation failed";
    one_shot = true;
}

symbol "DKIM_MIXED" {
    weight = 0.5;
    description = "Multiple DKIM signatures with mixed results";
}

symbol "R_SPF_FAIL" {
    weight = 1.0;
    description = "SPF record validation failed";
    one_shot = true;
}

symbol "DMARC_BAD_POLICY" {
    weight = 2.0;
    description = "DMARC policy violation";
    one_shot = true;
}

symbol "BAYES_SPAM" {
    weight = 3.0;
    description = "Bayesian classifier: spam";
}

symbol "BAYES_HAM" {
    weight = -3.0;
    description = "Bayesian classifier: ham";
}

# Subject for spam messages
subject = "[SPAM] %s";

# Unknown weight
unknown_weight = 5.0;

# Growth factor for fuzzy checks
growth_factor = 1.1;

# Confirmed duplicate detection
conf_dup_cache_size = 1000;

# Show default symbols
show_default = true;
