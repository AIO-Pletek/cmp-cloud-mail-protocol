# CMP ClamAV Daemon Configuration
# /etc/clamav/clamd.conf

# PID file
PidFile /run/clamav/clamd.pid

# Temporary directory
TemporaryDirectory /tmp

# Database directory
DatabaseDirectory /var/lib/clamav

# Log file
LogFile /var/log/clamav/clamav.log
LogFileMaxSize 50M
LogTime yes
LogRotate yes
LogVerbose no
LogSyslog yes

# Socket for communication
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660

# TCP socket for Rspamd integration
TCPSocket 3310
TCPAddr 127.0.0.1

# Max file size (100MB)
MaxFileSize 100M

# Max scan size (400MB)
MaxScanSize 400M

# Max recursion depth
MaxRecursion 30

# Max files in archive
MaxFiles 10000

# Max embedded PE size
MaxEmbeddedPE 40M

# Max HTML normalize
MaxHTMLNormalize 40M

# StreamMaxLength
StreamMaxLength 100M

# Database checks
DatabaseMirror database.clamav.net
DatabaseMirror db.local.clamav.net

# Reload DB on update
SelfCheck 600

# Run as
User clamav

# Virus action
VirusEvent /etc/clamav/virus-action.sh

# Alert on broken executables
AlertBrokenExecutables yes

# Alert on encrypted archives
AlertEncrypted no
AlertEncryptedArchive no
AlertEncryptedDoc no

# Scan settings
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanMail yes
ScanArchive yes
ArchiveBlockEncrypted no

# Bytecode
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 60000

# Performance
ReadTimeout 180
SendBufTimeout 200

# Exclude patterns (optional)
# ExcludePath ^/proc/
# ExcludePath ^/sys/
