# CMP ClamAV Freshclam Configuration
# /etc/clamav/freshclam.conf

# Database directory
DatabaseDirectory /var/lib/clamav

# Update log file
UpdateLogFile /var/log/clamav/freshclam.log
LogFileMaxSize 50M
LogTime yes
LogVerbose no
LogRotate yes
LogSyslog yes

# Database mirrors
DatabaseMirror database.clamav.net
DatabaseMirror db.local.clamav.net
DatabaseMirror db.uk.clamav.net
DatabaseMirror db.de.clamav.net

# Max attempts to download
MaxAttempts 5

# DNS database info
DNSDatabaseInfo current.cvd.clamav.net

# Database owner
DatabaseOwner clamav

# Pid file
PidFile /run/clamav/freshclam.pid

# Check interval (12 hours = 43200)
Checks 24

# Notify clamd on update
NotifyClamd /etc/clamav/clamd.conf

# Compress local database
CompressLocalDatabase no

# Scripted updates (bandwidth efficient)
ScriptedUpdates yes

# Proxy settings (uncomment if needed)
# HTTPProxyServer proxy.example.com
# HTTPProxyPort 3128
# HTTPProxyUsername proxyuser
# HTTPProxyPassword proxypass

# Test databases
TestDatabases yes

# User agent
UserAgent CMP-Freshclam/1.0

# Custom temp directory
ReceiveTimeout 30
SubmitDetectionStats no

# Bytecode
Bytecode yes
